      <noscript>
        <h1>PedEdit</h1>
        <p>A free, open-source pedigree editor for clinical genetics, genetic counselling and research. No account required: each pedigree is saved at its own private URL that you bookmark or share.</p>
        <p>Automatic layout ported from the kinship2 R package handles consanguinity, multiple partners and complex families. Drag-and-drop repositioning, standard NSGC symbols, PED import, and SVG, PNG, PDF and CSV export.</p>
        <p>PedEdit needs JavaScript to run. Source code: <a href="https://github.com/SACGF/pededit">github.com/SACGF/pededit</a></p>
