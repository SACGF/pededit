<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PedEdit: Free Online Pedigree Chart Maker, No Sign-up</title>
    <meta name="description" content="Free online pedigree chart maker with no sign-up. Standard NSGC symbols, automatic layout from kinship2 that handles consanguinity and multiple partners, drag-and-drop repositioning, PED import, SVG/PNG/PDF export. Open source." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PedEdit: Free Online Pedigree Chart Maker, No Sign-up" />
    <meta property="og:description" content="Free online pedigree chart maker with no sign-up. Standard NSGC symbols, automatic layout from kinship2 that handles consanguinity and multiple partners, drag-and-drop repositioning, PED import, SVG/PNG/PDF export. Open source." />
    <meta property="og:image" content="https://pededit.com/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PedEdit: Free Online Pedigree Chart Maker, No Sign-up" />
    <meta name="twitter:description" content="Free online pedigree chart maker with no sign-up. Standard NSGC symbols, automatic layout from kinship2 that handles consanguinity and multiple partners, drag-and-drop repositioning, PED import, SVG/PNG/PDF export. Open source." />
    <meta name="twitter:image" content="https://pededit.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://pededit.com/" />
    <!-- The static page is in every route's HTML; show it only on its own path until the app draws. The build writes each page's path here. -->
    <script>if (location.pathname !== "/") document.documentElement.setAttribute("data-app-route", "");</script>
    <style>[data-app-route] [data-prerendered] { display: none; }</style>
  </head>
  <body>
    <div id="root">
      <!-- The build writes the landing page, or a guide in its own file, here as static HTML (#25, #202, prerenderPlugin in vite.config.ts). The app draws over it. -->
      <!--prerendered-landing-->
      <noscript>
        <p class="px-8 pb-4 text-center text-xs text-gray-500">PedEdit needs JavaScript to run. Source code: <a href="https://github.com/SACGF/pededit">github.com/SACGF/pededit</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
