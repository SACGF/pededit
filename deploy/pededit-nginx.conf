# HSTS (#47). Django sends Strict-Transport-Security on what it serves (/api/
# and /admin/, once "https": true is in /etc/pededit/pededit.json). The
# frontend and /djstatic/ never reach Django, so Nginx sends the header on
# those, in each location that has an add_header of its own (Nginx does not
# inherit add_header into such a location). Do not add it at server level: the
# proxied locations would then carry it twice.
#
# Keep max-age equal to "hsts_seconds" in pededit.json (default 3600) and
# raise both together. Browsers ignore the header over plain HTTP, so it is
# harmless before Certbot has added TLS.
#
# X-Forwarded-Proto on every proxied location is what tells Django a request
# was https (SECURE_PROXY_SSL_HEADER). With "https": true, a location that
# does not send it redirects for ever.
server {
    listen 80;
    server_name your-domain.example.com;

    # Django admin static files
    location /djstatic/ {
        alias /opt/pededit/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
    }

    # Health check: polled by deploy.sh and uptime monitoring, kept out of the
    # access log. Gunicorn drops it from its own log too (gunicorn.conf.py).
    # Keep the X-Forwarded-* headers: they are how the app knows the request
    # came from outside, and it only tells its git commit to a caller on the
    # box (backend/api/health.py).
    location = /api/health/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API and admin — proxy to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Plain text for AI assistants (#200): llms.txt and the JSON format
    # reference copied into the build from docs/. A missing file is a 404,
    # not the app's index.html, and .md (absent from Nginx's mime.types) is
    # served as Markdown, all as UTF-8.
    location = /llms.txt {
        root /opt/pededit/frontend/dist;
        charset utf-8;
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
    }

    location /docs/ {
        root /opt/pededit/frontend/dist;
        types {
            text/markdown md;
            application/json json;
        }
        charset utf-8;
        charset_types text/markdown application/json;
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
    }

    # Frontend SPA — serve Vite build, fall back to index.html for client-side routing.
    # $uri.html is a prerendered page: /guides/consanguinity is guides/consanguinity.html (#202).
    location / {
        root /opt/pededit/frontend/dist;
        try_files $uri $uri.html $uri/ /index.html;
        add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;

        # Vite hashed assets get long cache
        location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
        }
    }
}
