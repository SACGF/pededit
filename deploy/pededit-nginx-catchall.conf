# Catch-all for requests whose Host is not the site's own name: scanners
# trying the server's IP address or a made-up name. Nginx closes the
# connection (444) without answering, so they never reach Django, which would
# answer 400 and log DisallowedHost. The pededit vhost answers only for its
# server_name once this file is the default_server.
#
# Over https, ssl_reject_handshake (Nginx 1.19.4+) refuses the TLS handshake,
# so no certificate is needed here and the real one is never shown to a
# client that did not ask for the site by name.
#
# Install as /etc/nginx/sites-available/catchall and link it into
# sites-enabled (INSTALL.md step 7).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}
