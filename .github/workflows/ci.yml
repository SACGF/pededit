# Unit tests, type check, a dead code report and the agent page checks (#72) on every PR and push to main.
# The page checks are frontend/scripts/browser/: see its README.md.
# Each job runs the root package.json scripts, so `npm run check` and, with
# the servers up, `npm run check:pages` run the same things on a desk.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Layout engine tests
        run: npm run test:layout
      # Builds dist/ and lists the npm tarball (#22). Nothing is published,
      # and nothing else in CI uses the build: the frontend reads the source.
      - name: Layout engine package build
        run: npm -w layout-engine pack --dry-run
      - name: Type check (layout engine and frontend, tests included)
        run: npm run typecheck
      - name: Hooks lint (rules of hooks, effect dependencies)
        run: npm run lint
      - name: Frontend tests
        run: npm run test:frontend
      # What deploy.sh runs. It also prerenders the static pages, which
      # throws on text they cannot render (vite.config.ts, prerenderPlugin).
      - name: Frontend build
        run: npm -w frontend run build
      - name: Paths named in the agent guides exist
        run: npm run test:docs
      # Reported as a warning, never fails the build: knip can be wrong about
      # code reached in a way it cannot follow. See "Dead code" in frontend/AGENTS.md.
      - name: Dead code (knip)
        continue-on-error: true
        run: npm run deadcode || { echo "::warning title=Dead code::knip found unused files, exports or dependencies. Run 'npm run deadcode' and see Dead code in frontend/AGENTS.md."; exit 1; }

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        working-directory: backend
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv -r requirements.txt
      # Reads backend/test_config.json (SQLite in memory) through PEDEDIT_CONFIG.
      - name: Test
        run: npm run test:backend

  page-checks:
    name: Page checks (render lint, export lint, console, persistence, flows)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
      - run: npm ci
      - name: Install headless chromium
        run: npx -w frontend playwright install --with-deps chromium-headless-shell
      - name: Backend for --fixture-via-api
        run: |
          sudo mkdir -p /etc/pededit
          echo '{"database_url": "sqlite:///${{ runner.temp }}/pededit.sqlite3", "debug": true, "cors_allowed_origins": ["http://localhost:5173"]}' | sudo tee /etc/pededit/pededit.json
          cd backend
          uv venv --python 3.13 .venv
          uv pip install --python .venv -r requirements.txt
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py createcachetable
      - name: Start Vite and Django
        run: node frontend/scripts/browser/servers.mjs up
      # Render and export lint over every example and feature fixture (also
      # compact and de-identified), the console sweep with each saved and
      # reloaded through the API, the end-to-end flows and the emulated phone.
      - name: Page checks
        run: npm run check:pages
      # The tail of each log, then every traceback and 5xx in the Django log
      # with the lines round it, however early in the run it came.
      - name: Server logs
        if: failure()
        run: |
          cd node_modules/.cache/pededit-browser || exit 0
          for f in *.log; do echo "::group::$f (last 100 lines)"; tail -n 100 "$f"; echo "::endgroup::"; done
          echo "Tracebacks and 5xx responses in django.log:"
          grep -n -B 5 -A 30 -E 'Traceback \(most recent call last\)|" 5[0-9][0-9] |Internal Server Error' django.log || echo "(none)"
      - name: Stop servers
        if: always()
        run: node frontend/scripts/browser/servers.mjs down
